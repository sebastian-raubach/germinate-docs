<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="{{ '/' | relative_url }}" class="brand">
        <img src="{{ '/assets/images/germinate-square.svg' | relative_url }}" alt="Germinate Logo" class="brand-logo">
        <span class="brand-text">Germinate <small>Docs</small></span>
      </a>
      <nav class="top-nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/docs/germplasm/' | relative_url }}">Germplasm</a>
        <a href="{{ '/docs/phenotypes/' | relative_url }}">Phenotypes</a>
        <a href="{{ '/docs/genotypes/' | relative_url }}">Genotypes</a>
        <a href="{{ '/docs/data-import/' | relative_url }}">Import</a>
      </nav>
    </div>
  </header>

  <main class="container main-content">
    {{ content }}
  </main>

  <div id="imageModal" class="img-modal" onclick="closeModal()">
    <img id="modalImage">
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>Germinate Documentation &bull; Built for Plant Genetic Resources</p>
    </div>
  </footer>
</body>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const images = document.querySelectorAll(".doc-body img");
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImage");

    images.forEach(img => {
      img.addEventListener("click", function () {
        modal.style.display = "flex";
        modalImg.src = this.src;
      });
    });
  });

  function closeModal() {
    document.getElementById("imageModal").style.display = "none";
  }
</script>
</html>
