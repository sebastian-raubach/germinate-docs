title: Germinate Documentation
description: Open-source plant genetic resources database platform documentation.
baseurl: "germinate-docs" # Leave empty if using a custom domain or user.github.io, otherwise "/your-repo-name"
url: "https://sebastian-raubach.github.io/germinate-docs"     # Your GitHub Pages URL

markdown: kramdown
permalink: pretty
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    disable: false
    css_class: highlight

# Navigation items used in the header and landing page
user_pages:
  - title: Germplasm & Passport Data
    url: /docs/user/germplasm/
    description: Managing accessions, taxonomy, biological status, and geographic origins.
  - title: Phenotypic & Trial Data
    url: /docs/user/phenotypes/
    description: Recording field trials, trait definitions, observations, and environmental metrics.
  - title: Genotypic & Marker Data
    url: /docs/user/genotypes/
    description: Storing SNP matrices, genetic maps, alleles, and molecular marker datasets.
  - title: Data Import & Templates
    url: /docs/user/data-import/
    description: Using Germinate data templates, validation tools, and BrAPI integration.
  - title: Visualizations & Export
    url: /docs/user/visualizations/
    description: Interactive maps, pedigree trees, trait distributions, and Flapjack exports.

admin_pages:
  - title: Setup Instructions
    url: /docs/admin/setup/
    description: Create and host your own instance of Germinate using Docker.
  - title: Setup Example
    url: /docs/admin/example-setup/
    description: An example configuration for Germinate and Gatekeeper.
  - title: Germinate Configuration
    url: /docs/admin/configuration/
    description: All configuration options for Germinate.
  - title: Migration Information
    url: /docs/admin/migration/
    description: Any manual changes that need to be made between Germinate version updates.
  - title: Frequently Asked Questions
    url: /docs/admin/faq/
    description: Answers to a list of questions that we often get about Germinate.

funders:
  - name: The James Hutton Institute
    logo: /assets/images/funders/hutton.svg
    url: https://www.hutton.ac.uk/
  - name: BBSRC
    logo: /assets/images/funders/bbsrc.svg
    url: https://www.ukri.org/councils/bbsrc/
  - name: Crop Trust
    logo: /assets/images/funders/crop-trust.svg
    url: https://www.croptrust.org/