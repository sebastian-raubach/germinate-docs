---
layout: default
---
<div class="doc-layout">
  <aside class="doc-sidebar">
    <h3>Documentation</h3>
    <ul>
      <li><a href="{{ '/' | relative_url }}">Overview</a></li>
      {% for item in site.nav_pages %}
        <li>
          <a href="{{ item.url | relative_url }}" class="{% if page.url == item.url %}active{% endif %}">
            {{ item.title }}
          </a>
        </li>
      {% endfor %}
    </ul>
  </aside>

  <article class="doc-body">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="doc-subtitle">{{ page.subtitle }}</p>
    {% endif %}
    <hr>
    {{ content }}
  </article>
</div>
